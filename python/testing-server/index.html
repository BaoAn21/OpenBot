<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depth Map Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            color: #333;
        }
        #dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            width: 100%;
            margin-top: 0;
            margin-bottom: 0;
            color: #111;
        }
        
        /* Left Column: Visuals */
        #visuals {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            width: 400px;  /* Scaled up 256x256 */
            height: 400px;
            border: 2px solid #ccc;
            border-radius: 8px;
            image-rendering: pixelated; 
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background: #333;
        }

        /* Right Column: Data */
        #stats {
            text-align: left;
        }
        #stats h2 {
            margin-top: 0;
            text-align: center;
        }
        .stat-item {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .stat-item span {
            font-weight: bold;
            display: inline-block;
            width: 80px;
            text-align: right;
            margin-left: 10px;
        }

        /* Status Bar */
        #status {
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
            height: 1.5em;
            color: #d9534f; /* Red by default */
        }
        #status.connected {
            color: #5cb85c; /* Green when connected */
        }

        /* Grid Table */
        #grid-table {
            border-collapse: collapse;
            margin-top: 1rem;
            /* Each cell is 40px, 8 cells wide = 320px */
            width: 320px; 
            height: 320px;
        }
        #grid-table td {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            transition: background-color 0.1s;
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <h1>Depth Map Dashboard</h1>
        <p id="status">Connecting...</p>
        
        <div id="visuals">
            <h2>Live Feed</h2>
            <canvas id="depthCanvas" width="256" height="256"></canvas>
        </div>

        <div id="stats">
            <h2>Live Data</h2>
            <div class="stat-item">Min: <span id="minVal">--</span></div>
            <div class="stat-item">Max: <span id="maxVal">--</span></div>
            <div class="stat-item">Avg: <span id="avgVal">--</span></div>

            <table id="grid-table">
                </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('depthCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const statusEl = document.getElementById('status');
            
            // Get stat elements
            const minValEl = document.getElementById('minVal');
            const maxValEl = document.getElementById('maxVal');
            const avgValEl = document.getElementById('avgVal');
            const gridTable = document.getElementById('grid-table');

            // --- Grid Constants ---
            const IMAGE_DIM = 256;
            const PIXEL_COUNT = IMAGE_DIM * IMAGE_DIM;
            const GRID_DIM = 8; // 8x8 grid
            const GRID_CELL_SIZE = IMAGE_DIM / GRID_DIM; // 256 / 8 = 32
            const GRID_PIXEL_COUNT = GRID_CELL_SIZE * GRID_CELL_SIZE; // 32 * 32 = 1024
            const GRID_SQUARE_COUNT = GRID_DIM * GRID_DIM; // 8 * 8 = 64

            // --- Canvas Setup ---
            const imageData = ctx.createImageData(IMAGE_DIM, IMAGE_DIM);
            const pixelData = imageData.data;

            // --- Create Grid Table in HTML ---
            let gridCellElements = [];
            let tableHtml = '<tbody>';
            for (let y = 0; y < GRID_DIM; y++) {
                tableHtml += '<tr>';
                for (let x = 0; x < GRID_DIM; x++) {
                    const id = `grid-cell-${(y * GRID_DIM) + x}`;
                    tableHtml += `<td id="${id}">-</td>`;
                }
                tableHtml += '</tr>';
            }
            tableHtml += '</tbody>';
            gridTable.innerHTML = tableHtml;
            // Store references to all 64 cell elements
            for (let i = 0; i < GRID_SQUARE_COUNT; i++) {
                gridCellElements.push(document.getElementById(`grid-cell-${i}`));
            }

            // --- WebSocket Connection ---
            const socket = new WebSocket('ws://localhost:8765'); // Assumes server is on same machine

            socket.onopen = () => {
                console.log("WebSocket connection established.");
                statusEl.textContent = "Connected. Waiting for data...";
                statusEl.className = "connected";
            };

            socket.onmessage = (event) => {
                try {
                    const depthArray = JSON.parse(event.data);
                    
                    if (depthArray.length !== PIXEL_COUNT) {
                        console.warn(`Received data of incorrect length: ${depthArray.length}`);
                        return;
                    }

                    // --- 1. Calculate Statistics ---
                    let min = depthArray[0];
                    let max = depthArray[0];
                    let sum = 0;
                    
                    // Create an array to hold the sums for each of the 64 grid squares
                    let gridSums = new Array(GRID_SQUARE_COUNT).fill(0);

                    for (let i = 0; i < PIXEL_COUNT; i++) {
                        const val = depthArray[i];

                        // Overall stats
                        sum += val;
                        if (val < min) min = val;
                        if (val > max) max = val;
                        
                        // --- 2. Update Canvas Pixel Data ---
                        const grayscale = Math.floor(val);
                        const pixelIndex = i * 4; 
                        pixelData[pixelIndex]     = grayscale; // R
                        pixelData[pixelIndex + 1] = grayscale; // G
                        pixelData[pixelIndex + 2] = grayscale; // B
                        pixelData[pixelIndex + 3] = 255;       // A

                        // --- 3. Add to correct Grid Sum ---
                        const x = i % IMAGE_DIM;
                        const y = Math.floor(i / IMAGE_DIM);
                        
                        const gridX = Math.floor(x / GRID_CELL_SIZE);
                        const gridY = Math.floor(y / GRID_CELL_SIZE);
                        const gridIndex = (gridY * GRID_DIM) + gridX;
                        
                        gridSums[gridIndex] += val;
                    }

                    // --- 4. Update Canvas Display ---
                    ctx.putImageData(imageData, 0, 0);

                    // --- 5. Update Stats Display ---
                    minValEl.textContent = min.toFixed(2);
                    maxValEl.textContent = max.toFixed(2);
                    avgValEl.textContent = (sum / PIXEL_COUNT).toFixed(2);

                    // --- 6. Update Grid Display ---
                    for (let i = 0; i < GRID_SQUARE_COUNT; i++) {
                        const cell = gridCellElements[i];
                        const avg = gridSums[i] / GRID_PIXEL_COUNT;
                        
                        // Set the text
                        cell.textContent = avg.toFixed(0);
                        
                        // Set the background color (heatmap)
                        // "larger... darker" -> larger avg = darker color
                        const colorVal = 255 - Math.floor(avg); // 255 -> 0 (black), 0 -> 255 (white)
                        cell.style.backgroundColor = `rgb(${colorVal}, ${colorVal}, ${colorVal})`;
                        
                        // Make text color readable
                        cell.style.color = (avg > 128) ? 'white' : 'black';
                    }

                } catch (e) {
                    console.error("Failed to process incoming message:", e);
                }
            };

            socket.onclose = (event) => {
                console.log("WebSocket connection closed:", event.reason);
                statusEl.textContent = `Disconnected. (Code: ${event.code})`;
                statusEl.className = "";
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                statusEl.textContent = "Connection Error.";
                statusEl.className = "";
            };
        });
    </script>
</body>
</html>
