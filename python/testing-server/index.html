<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depth Map Dashboard</title>
    <style>
        /* --- CSS is unchanged --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            color: #333;
        }
        #dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            width: 100%;
            margin-top: 0;
            margin-bottom: 0;
            color: #111;
        }
        #visuals {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            width: 400px;
            height: 400px;
            border: 2px solid #ccc;
            border-radius: 8px;
            image-rendering: pixelated; 
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background: #333;
        }
        #stats {
            text-align: left;
        }
        #stats h2 {
            margin-top: 0;
            text-align: center;
        }
        .stat-item {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .stat-item span {
            font-weight: bold;
            display: inline-block;
            width: 80px;
            text-align: right;
            margin-left: 10px;
        }
        #status {
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
            height: 1.5em;
            color: #d9534f;
        }
        #status.connected {
            color: #5cb85c;
        }
        #grid-table {
            border-collapse: collapse;
            margin-top: 1rem;
            width: 320px; 
            height: 320px;
        }
        #grid-table td {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            transition: background-color 0.1s;
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <h1>Depth Map Dashboard</h1>
        <p id="status">Connecting...</p>
        
        <div id="visuals">
            <h2>Live Feed</h2>
            <canvas id="depthCanvas" width="256" height="256"></canvas>
        </div>

        <div id="stats">
            <h2>Live Data (Raw Inverse Depth)</h2>
            <div class="stat-item">Min: <span id="minVal">--</span></div>
            <div class="stat-item">Max: <span id="maxVal">--</span></div>
            <div class="stat-item">Avg: <span id="avgVal">--</span></div>

            <table id="grid-table">
                </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('depthCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const statusEl = document.getElementById('status');
            
            const minValEl = document.getElementById('minVal');
            const maxValEl = document.getElementById('maxVal');
            const avgValEl = document.getElementById('avgVal');
            const gridTable = document.getElementById('grid-table');

            // --- Grid Constants ---
            const IMAGE_DIM = 256;
            const PIXEL_COUNT = IMAGE_DIM * IMAGE_DIM;
            const GRID_DIM = 8;
            const GRID_CELL_SIZE = IMAGE_DIM / GRID_DIM;
            const GRID_PIXEL_COUNT = GRID_CELL_SIZE * GRID_CELL_SIZE;
            const GRID_SQUARE_COUNT = GRID_DIM * GRID_DIM;

            const imageData = ctx.createImageData(IMAGE_DIM, IMAGE_DIM);
            const pixelData = imageData.data;

            // --- Create Grid Table ---
            let gridCellElements = [];
            let tableHtml = '<tbody>';
            for (let y = 0; y < GRID_DIM; y++) {
                tableHtml += '<tr>';
                for (let x = 0; x < GRID_DIM; x++) {
                    const id = `grid-cell-${(y * GRID_DIM) + x}`;
                    tableHtml += `<td id="${id}">-</td>`;
                }
                tableHtml += '</tr>';
            }
            tableHtml += '</tbody>';
            gridTable.innerHTML = tableHtml;
            for (let i = 0; i < GRID_SQUARE_COUNT; i++) {
                gridCellElements.push(document.getElementById(`grid-cell-${i}`));
            }

            // =================================================================
            // --- +++ NEW: HEATMAP COLOR FUNCTION +++ ---
            // =================================================================
            /**
             * Converts a normalized value (0.0 - 1.0) into an [r, g, b] color array.
             * 0.0 = Blue (far)
             * 0.5 = Green/Yellow (mid)
             * 1.0 = Red (close)
             */
            function applyHeatmap(v) {
                let r = 0, g = 0, b = 0;

                // Simple linear interpolation for a "jet" style colormap
                // v = 0.0 (blue) -> 0.5 (green) -> 1.0 (red)
                
                // Blue to Green (0.0 -> 0.5)
                if (v < 0.5) {
                    r = 0;
                    g = Math.floor(255 * (v * 2)); // 0 -> 255
                    b = Math.floor(255 * (1 - (v * 2))); // 255 -> 0
                } 
                // Green to Red (0.5 -> 1.0)
                else {
                    r = Math.floor(255 * ((v - 0.5) * 2)); // 0 -> 255
                    g = Math.floor(255 * (1 - ((v - 0.5) * 2))); // 255 -> 0
                    b = 0;
                }
                
                return [r, g, b];
            }
            // =================================================================


            // --- WebSocket Connection ---
            const socket = new WebSocket('ws://localhost:8765'); 

            socket.onopen = () => {
                console.log("WebSocket connection established.");
                statusEl.textContent = "Connected. Waiting for data...";
                statusEl.className = "connected";
            };

            socket.onmessage = (event) => {
                try {
                    const depthArray = JSON.parse(event.data);
                    
                    if (depthArray.length !== PIXEL_COUNT) {
                        console.warn(`Received data of incorrect length: ${depthArray.length}`);
                        return;
                    }

                    // --- 1. First Pass: Calculate Stats ---
                    let min = depthArray[0];
                    let max = depthArray[0];
                    let sum = 0;
                    let gridSums = new Array(GRID_SQUARE_COUNT).fill(0);

                    for (let i = 0; i < PIXEL_COUNT; i++) {
                        const val = depthArray[i];
                        sum += val;
                        if (val < min) min = val;
                        if (val > max) max = val;
                        
                        const x = i % IMAGE_DIM;
                        const y = Math.floor(i / IMAGE_DIM);
                        const gridX = Math.floor(x / GRID_CELL_SIZE);
                        const gridY = Math.floor(y / GRID_CELL_SIZE);
                        const gridIndex = (gridY * GRID_DIM) + gridX;
                        gridSums[gridIndex] += val;
                    }
                    
                    const range = max - min;
                    
                    // --- 2. Update Stats Display (with RAW data) ---
                    minValEl.textContent = min.toFixed(3);
                    maxValEl.textContent = max.toFixed(3);
                    avgValEl.textContent = (sum / PIXEL_COUNT).toFixed(3);

                    // --- 3. Second Pass: Normalize and Update Canvas ---
                    if (range > 1e-6) {
                        for (let i = 0; i < PIXEL_COUNT; i++) {
                            const normalized = (depthArray[i] - min) / range;
                            
                            // +++ Use heatmap function +++
                            const [r, g, b] = applyHeatmap(normalized);
                            
                            const pixelIndex = i * 4; 
                            pixelData[pixelIndex]     = r; // Red
                            pixelData[pixelIndex + 1] = g; // Green
                            pixelData[pixelIndex + 2] = b; // Blue
                            pixelData[pixelIndex + 3] = 255; // Alpha
                        }
                    } else {
                        // Range is zero, just draw a black image
                        for (let i = 0; i < PIXEL_COUNT; i++) {
                            const pixelIndex = i * 4; 
                            pixelData[pixelIndex]     = 0; // R
                            pixelData[pixelIndex + 1] = 0; // G
                            pixelData[pixelIndex + 2] = 0; // B
                            pixelData[pixelIndex + 3] = 255; // A
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);


                    // --- 4. Update Grid Display ---
                    for (let i = 0; i < GRID_SQUARE_COUNT; i++) {
                        const cell = gridCellElements[i];
                        const avgRaw = gridSums[i] / GRID_PIXEL_COUNT;
                        
                        // Set the text to the RAW average value
                        cell.textContent = avgRaw.toFixed(2);
                        
                        // Set background heatmap based on normalized value
                        let normalizedAvg = 0;
                        if (range > 1e-6) {
                            normalizedAvg = (avgRaw - min) / range;
                        }
                        
                        // +++ Use heatmap function +++
                        const [r, g, b] = applyHeatmap(normalizedAvg);
                        cell.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                        
                        // Adjust text color for readability
                        // Green/Yellow are bright, Blue/Red are dark
                        cell.style.color = (normalizedAvg > 0.25 && normalizedAvg < 0.75) ? 'black' : 'white';
                    }

                } catch (e) {
                    console.error("Failed to process incoming message:", e);
                }
            };
            
            socket.onclose = (event) => { /* ... (same as before) ... */ };
            socket.onerror = (error) => { /* ... (same as before) ... */ };
        });
    </script>
</body>
</html>
